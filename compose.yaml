services:
  db-profile:
    image: postgres:16
    container_name: postgres-db-management-profile
    ports:
      - ${POSTGRESQL_PROFILE_PORT_EXPOSE}:${POSTGRESQL_PROFILE_PORT_INTER}
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${POSTGRESQL_PROFILE_P}
      POSTGRES_PASSWORD: ${POSTGRESQL_PROFILE_PASSWORD}
      POSTGRES_DB: ${POSTGRESQL_PROFILE_DB}
    volumes:
      - ${POSTGRESQL_PROFILE_VOLUMEN_DATA_SAVE}
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRESQL_PROFILE_P} -d ${POSTGRESQL_PROFILE_DB}",
        ]
      interval: 5s
      timeout: 5s
      retries: 5

  db-logs:
    image: mongo:8.2
    restart: unless-stopped
    ports:
      - ${MONGO_DOCKER_EXPOSE_PORT}:${MONGO_PORT_DOCKER}
    command: mongod --wiredTigerCacheSizeGB 0.5 --bind_ip_all
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${USERNAME_MONGO}
      MONGO_INITDB_ROOT_PASSWORD: ${PASSWORD_USERNAME_MONGO}
      MONGO_INITDB_DATABASE: ${DATABASE_NAME}
    volumes:
      - ${VOLUME_STORE_DATA}
    healthcheck:
      test:
        - CMD
        - mongosh
        - --eval
        - "db.adminCommand('ping')"
        - --username
        - ${USERNAME_MONGO}
        - --password
        - ${PASSWORD_USERNAME_MONGO}
        - --authenticationDatabase
        - admin
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  db-e:
    image: postgres:17
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - ${POSTGRES_PORT_EXPOSE}:${POSTGRES_PORT_DOCKER}
    volumes:
      - ${POSTGRES_VOLUMEN_DATA_SAVE}
      - ${POSTGRES_VOLUMEN_DATABASE}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  db-d:
    image: mysql:9.6.0
    restart: unless-stopped
    env_file:
      - .env
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    ports:
      - ${MYSQL_PORT_EXPOSE}:${MYSQL_PORT}
    volumes:
      - ${VOLUMES_DB_SAVE}
      - ${VOLUME_CREATE_DATABASES}
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 4s
      timeout: 9s
      retries: 10

  service-departments:
    depends_on:
      db-d:
        condition: service_healthy
    build: ./department_backend/
    env_file:
      - .env
    restart: on-failure
    ports:
      - ${PORT_EXPOSE_SERVICE_DEPARTMENTS}:${PORT_DOCKER}
    environment:
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_DBNET: ${MYSQL_DBNET}
      PORT_LISTEN: ${PORT_DOCKER}
      MYSQL_DBADDR: db-d
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      OTEL_SERVICE_NAME: service-departments
      OTEL_EXPORTER_ZIPKIN_ENDPOINT: http://zipkin:9411/api/v2/spans
      OTEL_PROPAGATORS: tracecontext,baggage

  service-employees:
    depends_on:
      db-e:
        condition: service_healthy
      service-rabbitmq:
        condition: service_healthy
    build: ./employee-backend/
    env_file:
      - .env
    restart: on-failure
    ports:
      - ${PORT_SE_EXPOSE}:${PORT_SE_DOCKER}
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      SERVER_DRIVE: ${SERVER_DRIVE}
      DDL_AUTO: ${DDL_AUTO}
      HIBERNATE_DIALECT: ${HIBERNATE_DIALECT}
      DB_URI: db-e
      PORT: ${POSTGRES_PORT_DOCKER}
      NAME_DATABASE: ${POSTGRES_DB}
      RABBIT_USERNAME: ${RABBITMQ_DEFAULT_USER}
      RABBIT_PASSWORD: ${RABBITMQ_DEFAULT_PASS}
      RABBIT_PORT: ${PORTS_CLIENT_RABBIT_DOCKER}
      RABBIT_HOST: service-rabbitmq
      NAME_QUEUE: ${NAME_QUEUE}
      EVENT_ONE: ${EVENT_ONE}
      EVENT_TWO: ${EVENT_TWO}
      DIRECT_EXCHANGE: ${EXCHANGE_RABBIT}
      URI_SERVICE_D: http://service-departments:${PORT_DOCKER}
      OTEL_SERVICE_NAME: employee_microservice
      OTEL_EXPORTER_ZIPKIN_ENDPOINT: http://zipkin:9411/api/v2/spans
      OTEL_PROPAGATORS: tracecontext,baggage
      JAVA_TOOL_OPTIONS: "-javaagent:/app/opentelemetry-javaagent.jar -Dotel.traces.exporter=zipkin -Dotel.exporter.zipkin.endpoint=http://zipkin:9411/api/v2/spans -Dotel.metrics.exporter=none -Dotel.logs.exporter=none"

  service-rabbitmq:
    env_file:
      - .env
    image: rabbitmq:4.2.4-management-alpine
    ports:
      - ${PORTS_CLIENT_RABBIT_EXPOSE}:${PORTS_CLIENT_RABBIT_DOCKER}
      - ${PORTS_INTERFACE_RABBIT_EXPOSE}:${PORTS_INTERFACE_RABBIT_DOCKER}
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS}
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 30s
      start_period: 4s
      retries: 3

  auth-service:
    build: ./auth-service/
    restart: on-failure
    env_file:
      - .env
    ports:
      - ${PORT_AUTH_EXPOSE}:${PORT_AUTH_DOCKER}
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db-e:${POSTGRES_PORT_DOCKER}/${POSTGRES_DB}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      RABBITMQ_HOST: service-rabbitmq
      RABBITMQ_PORT: ${PORTS_CLIENT_RABBIT_DOCKER}
      RABBITMQ_USERNAME: ${RABBITMQ_DEFAULT_USER}
      RABBITMQ_PASSWORD: ${RABBITMQ_DEFAULT_PASS}
      EXCHANGE_RABBIT: ${EXCHANGE_RABBIT}
      EVENT_ONE: ${EVENT_ONE}
      EVENT_TWO: ${EVENT_TWO}
      EVENT_THREE: ${EVENT_THREE}
      AUTH_SERVICE_EMAIL: ${AUTH_SERVICE_EMAIL}
      AUTH_SERVICE_PASSWORD: ${AUTH_SERVICE_PASSWORD}
      AUTH_SERVICE_ROLE: ${AUTH_SERVICE_ROLE}
      OTEL_SERVICE_NAME: auth-service
      OTEL_EXPORTER_ZIPKIN_ENDPOINT: http://zipkin:9411/api/v2/spans
      OTEL_PROPAGATORS: tracecontext,baggage
      JAVA_TOOL_OPTIONS: "-javaagent:/app/opentelemetry-javaagent.jar -Dotel.traces.exporter=zipkin -Dotel.exporter.zipkin.endpoint=http://zipkin:9411/api/v2/spans -Dotel.metrics.exporter=none -Dotel.logs.exporter=none"
    depends_on:
      db-e:
        condition: service_healthy
      service-rabbitmq:
        condition: service_healthy

  service-logs:
    env_file:
      - .env
    build:
      context: ./microservice-logs/
      dockerfile: Dockerfile
    ports:
      - 8085:8080
    environment:
      RABBITMQ_USER: ${RABBITMQ_DEFAULT_USER}
      RABBITMQ_PASSWORD: ${RABBITMQ_DEFAULT_PASS}
      RABBITMQ_ADDRESS: service-rabbitmq
      RABBITMQ_PORT: ${PORTS_CLIENT_RABBIT_DOCKER}
      EXCHANGE_RABBIT: ${EXCHANGE_RABBIT}
      EVENT_ONE: ${EVENT_ONE}
      EVENT_TWO: ${EVENT_TWO}
      RABBITMQ_NAME: ${NAME_QUEUE}
      MONGO_INITDB_ROOT_USERNAME: ${USERNAME_MONGO}
      MONGO_INITDB_ROOT_PASSWORD: ${PASSWORD_USERNAME_MONGO}
      MONGO_INITDB_DATABASE: ${DATABASE_NAME}
      MONGO_HOST: db-logs
      MONGO_PORT: ${MONGO_PORT_DOCKER}
      OTEL_SERVICE_NAME: service-logs
      OTEL_EXPORTER_ZIPKIN_ENDPOINT: http://zipkin:9411/api/v2/spans
      OTEL_PROPAGATORS: tracecontext,baggage
    depends_on:
      service-rabbitmq:
        condition: service_healthy
      db-logs:
        condition: service_healthy

  service-profile:
    environment:
      - ConnectionStrings__DefaultConnection=Host=db-profile;Port=${POSTGRESQL_PROFILE_PORT_INTER};Database=${POSTGRESQL_PROFILE_DB};Username=${POSTGRESQL_PROFILE_P};Password=${POSTGRESQL_PROFILE_PASSWORD}
      - RABBITMQ_HOST=service-rabbitmq
      - RABBITMQ_USERNAME=${RABBITMQ_DEFAULT_USER}
      - RABBITMQ_PASSWORD=${RABBITMQ_DEFAULT_PASS}
      - OTEL_SERVICE_NAME=service-profile
      - OTEL_EXPORTER_ZIPKIN_ENDPOINT=http://zipkin:9411/api/v2/spans
      - OTEL_PROPAGATORS=tracecontext,baggage
    build:
      context: ./management_profile/
      dockerfile: Dockerfile
    ports:
      - ${SERVICE_PROFILE_PORT_EXPOSE}:${SERVICE_PROFILE_PORT_INTERN}
    depends_on:
      db-profile:
        condition: service_healthy

  # ── GATEWAY ────────────────────────────────────────────────────────

  api-gateway:
    build: ./api-gateway/
    restart: on-failure
    ports:
      - "8080:8080"
    environment:
      PORT: 8080
      JWT_SECRET: ${JWT_SECRET}
      AUTH_SERVICE_URL: http://auth-service:8080
      EMPLOYEES_SERVICE_URL: http://service-employees:8080
      DEPARTMENTS_SERVICE_URL: http://service-departments:8080
      PROFILE_SERVICE_URL: http://service-profile:8080
      LOGS_SERVICE_URL: http://service-logs:8080
      OTEL_SERVICE_NAME: api-gateway
    depends_on:
      - auth-service
      - service-employees
      - service-departments
      - service-logs
      - service-profile

  # ── OBSERVABILIDAD ────────────────────────────────────────────────────────

  prometheus:
    image: prom/prometheus:latest
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
    depends_on:
      - auth-service
      - service-employees
      - service-departments
      - service-logs
      - service-profile
      - api-gateway

  grafana:
    image: grafana/grafana:latest
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./observability/grafana/provisioning:/etc/grafana/provisioning
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    depends_on:
      - prometheus
      - loki

  loki:
    image: grafana/loki:latest
    restart: unless-stopped
    ports:
      - "3100:3100"
    command: -config.file=/etc/loki/local-config.yaml

  promtail:
    image: grafana/promtail:latest
    restart: unless-stopped
    volumes:
      - ./observability/promtail/promtail-config.yml:/etc/promtail/config.yml
      - /var/run/docker.sock:/var/run/docker.sock
    command: -config.file=/etc/promtail/config.yml
    depends_on:
      - loki

  zipkin:
    image: openzipkin/zipkin:latest
    restart: unless-stopped
    ports:
      - "9411:9411"

volumes:
  postgres-data:
  mongo_data:
  mysql-data:
  postgres_data:
  grafana-data: