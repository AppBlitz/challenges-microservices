global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'auth-service'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['auth-service:8080']

  - job_name: 'service-employees'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['service-employees:8080']

  - job_name: 'service-departments'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['service-departments:8080']

  - job_name: 'service-logs'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['service-logs:8080']

  - job_name: 'service-profile'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['service-profile:8080']

  - job_name: 'api-gateway'
    static_configs:
      - targets: [ 'api-gateway:8080' ]
    metrics_path: '/metrics'