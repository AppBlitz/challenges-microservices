spring:
  application:
    name: employee_microservice
  datasource:
    url: jdbc:postgresql://${DB_URI}:${PORT}/${NAME_DATABASE}
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
    driver-class-name: ${SERVER_DRIVE}

  jpa:
    hibernate:
      ddl-auto: ${DDL_AUTO}
    show-sql: true
    properties:
      hibernate:
        dialect: ${HIBERNATE_DIALECT}

  rabbitmq:
    username: ${RABBITMQ_DEFAULT_USER}
    password: ${RABBITMQ_DEFAULT_PASS}
    host: ${RABBITMQ_HOST}
    port: ${PORTS_CLIENT_RABBIT_DOCKER}
    event_one: ${EVENT_ONE}
    event_two: ${EVENT_TWO}
    direct_exchange: ${EXCHANGE_RABBIT}
    name_queue: ${NAME_QUEUE}

cors:
  hostOne: ${ORIGINONE}
  hostTwo: ${ORIGINTWO}
  hostThree: ${ORIGINTHREE}


management:
  endpoints:
    web:
      exposure:
        include: health,prometheus,info
  endpoint:
    health:
      show-details: always
  metrics:
    tags:
      application: employee_microservice